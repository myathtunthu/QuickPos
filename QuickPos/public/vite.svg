<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#00ffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <rect x="4" y="4" width="16" height="16" rx="2" ry="2" fill="#111827" />
  <rect x="4" y="4" width="16" height="4" rx="2" fill="#00ffff" stroke="none" opacity="0.2" />
  <line x1="8" y1="10" x2="16" y2="10" stroke="#b026ff" />
  <line x1="8" y1="14" x2="12" y2="14" />
  <line x1="8" y1="18" x2="16" y2="18" stroke="#00ffff" stroke-opacity="0.5" />
  <!-- Glow Effect -->
  <filter id="glow">
    <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
    <feMerge>
      <feMergeNode in="coloredBlur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <g filter="url(#glow)">
    <circle cx="16" cy="14" r="1" fill="#00ffff" stroke="none" />
  </g>
</svg>
